[project]
name = "sbompy"
version = "0.1.0"
description = "SBOMPY: API-triggered SBOM generator for running Docker workloads (SAND5G-oriented)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Nikolas Filippatos"},
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "docker>=7.0.0",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.5",
  "build>=0.7.0",
  "setuptools>=67.7.0",
  "wheel>=0.37.0",
  "twine>=3.4.2",
]
docs = [
  "pdoc3>=0.11.6",
]

[project.scripts]
sbompy = "sbompy.main:run"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
